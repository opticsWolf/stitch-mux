[package]
name = "stitch-mux-gui-egui"
description = "Disposable egui reference adapter for stitch-mux (M1)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "stitch-mux-gui"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
egui = "0.37"
stitch-mux-core.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
stitch-mux-client.workspace = true
stitch-mux-protocol.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
