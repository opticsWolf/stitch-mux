name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features gui -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p stitch-mux-test-fixtures
      - run: cargo test --workspace
      - run: cargo test --workspace --features gui

  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p stitch-mux-test-fixtures
      - run: cargo test --release -p stitch-mux --test stress -- --ignored
      - run: cargo test --release -p stitch-mux --test soak -- --ignored

  python:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: uv sync --extra test
      - run: uvx ruff check python tests
      - run: cargo build -p stitch-mux
      - name: Python SDK and offscreen Qt tests
        run: uv run pytest -q
        env:
          STITCH_MUX_BIN: ${{ github.workspace }}/target/debug/stitch-mux

  toolkit-neutral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --no-default-features
      - run: cargo check -p stitch-mux-gpui --features gpui
      - run: cargo doc --no-deps --workspace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inspect the crates.io archive
        run: cargo package --list
      - name: Verify the publishable package
        run: cargo publish --dry-run
      - name: Build the packaged source with the GUI feature
        run: |
          cargo package --no-verify
          crate=$(ls target/package/stitch-mux-*.crate | head -1)
          dir="${crate%.crate}"
          tar -xzf "$crate" -C target/package
          cargo build --manifest-path "$dir/Cargo.toml" --features gui
