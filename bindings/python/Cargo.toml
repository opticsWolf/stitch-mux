[package]
name = "stitch-mux-py"
description = "PyO3 control SDK for stitch-mux"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
# The Rust test harness needs a linkable Python DLL on Windows; the Python
# test suite exercises the extension through maturin instead.
test = false
doctest = false

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py311"] }
pythonize = "0.30"
serde_json.workspace = true
stitch-mux = { path = "../.." }
thiserror.workspace = true
tokio.workspace = true
