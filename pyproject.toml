[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "stitch-mux"
version = "0.1.0"
description = "Python control SDK and PySide6 adapter for stitch-mux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "opticsWolf", email = "opticswolf@protonmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
qt = ["PySide6>=6.8"]
test = ["PySide6>=6.8", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/opticsWolf/stitch-mux"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "stitch_mux._native"
manifest-path = "crates/stitch-mux-py/Cargo.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
