[workspace]
resolver = "2"
members = [
    "crates/stitch-mux-core",
    "crates/stitch-mux-protocol",
    "crates/stitch-mux-server",
    "crates/stitch-mux-client",
    "crates/stitch-mux",
    "crates/stitch-mux-gui-egui",
    "crates/stitch-mux-gui-gpui",
    "crates/stitch-mux-terminal",
    "crates/stitch-mux-py",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/opticsWolf/stitch-mux"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2"
stitch-pty = "0.15.0"
stitch-mux-core = { path = "crates/stitch-mux-core" }
stitch-mux-protocol = { path = "crates/stitch-mux-protocol" }
stitch-mux-client = { path = "crates/stitch-mux-client" }
stitch-mux-server = { path = "crates/stitch-mux-server" }
stitch-mux-gui-egui = { path = "crates/stitch-mux-gui-egui" }
stitch-mux-terminal = { path = "crates/stitch-mux-terminal" }
